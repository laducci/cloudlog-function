name: CI · testes da Azure Function

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Testes de arquitetura (ArchUnitTS)
        run: npm run test:arch -- --reporter=verbose
      - name: Testes unitários
        run: npm run test:unit -- --reporter=verbose
      - run: npm run build
